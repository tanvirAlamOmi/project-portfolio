name: Build & Deploy to ebnhost

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Next.js & Upload via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (static export)
        run: npm run build

      - name: Deploy to ebnhost via FTP (lftp)
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 3;
            open -u 'era@sejuti.com','$FTP_PASSWORD' 'ftp.sejuti.com';
            mirror --reverse --delete --verbose --parallel=4 ./out/ '/home/sejutico/sejuti.com/era/';
            bye
          "
